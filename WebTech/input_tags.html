<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form</title>
</head>
<body>
<form action="#" method="post">
<fieldset>

<table cellpadding="1" cellspacing="1">

    <tr>
        <td><label for="fname">FullName</label></td>
        <td>
            <input type="text" id="fname" name="fname" maxlength="20" pattern="[A-Za-z ]+">
            (max 20 char a-z and A-Z)
        </td>
    </tr>

    <tr>
        <td><label for="lname">Lastname</label></td>
        <td>
            <input type="text" id="lname" name="lname" maxlength="20" pattern="[A-Za-z ]+">
            (max 20 char a-z and A-Z)
        </td>
    </tr>

    <tr>
        <td><label for="dob">Date of Birth</label></td>
        <td><input type="date" id="dob" name="dob"></td>
    </tr>

    <tr>
        <td>GENDER</td>
        <td>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
        </td>
    </tr>

    <tr>
        <td><label for="email">EMAIL ID</label></td>
        <td><input type="email" id="email" name="email"></td>
    </tr>

    <tr>
        <td><label for="mobile">MOBILE<br>NO</label></td>
        <td>
            <input type="tel" id="mobile" name="mobile" maxlength="10" pattern="[0-9]{10}">
        </td>
    </tr>

    <tr>
        <td><label for="address">ADDRESS</label></td>
        <td><textarea id="address" name="address" rows="8" cols="22"></textarea></td>
    </tr>

    <tr>
        <td><label for="city">CITY</label></td>
        <td><input type="text" id="city" name="city"></td>
    </tr>

    <tr>
        <td><label for="pincode">PINCODE</label></td>
        <td>
            <input type="text" id="pincode" name="pincode" maxlength="6" pattern="[0-9]{6}">
            (6 digit number)
        </td>
    </tr>

    <tr>
        <td><label for="email2">EMAIL ID</label></td>
        <td><input type="email" id="email2" name="email2"></td>
    </tr>

    <tr>
        <td><label for="state">STATE</label></td>
        <td><input type="text" id="state" name="state"></td>
    </tr>

    <tr>
        <td><label for="country">COUNTRY</label></td>
        <td><input type="text" id="country" name="country"></td>
    </tr>

    <tr>
        <td>HOBBIES</td>
        <td>
            <input type="checkbox" id="drawing" name="hobbies" value="Drawing">
            <label for="drawing">Drawing</label>

            <input type="checkbox" id="singing" name="hobbies" value="Singing">
            <label for="singing">Singing</label>

            <input type="checkbox" id="dancing" name="hobbies" value="Dancing">
            <label for="dancing">Dancing</label>

            <br>

            <input type="checkbox" id="other" name="hobbies" value="Other">
            <label for="other">Other</label>
            <input type="text" name="other_hobby" size="20">
        </td>
    </tr>
</table>
<br>
<table cellpadding="1" cellspacing="1">
    <tr>
        <td></td>
        <td>sl.no Examination</td>
        <td>Board</td>
        <td>Percentage</td>
        <td>Year of pass</td>
    </tr>

    <tr>
        <td></td>
        <td>01 <input type="text" name="exam1" size="15"></td>
        <td><input type="text" name="board1" size="15"></td>
        <td><input type="text" name="percentage1" size="15"></td>
        <td><input type="text" name="year1" size="15"></td>
    </tr>

    <tr>
        <td>Qualification</td>
        <td>02 <input type="text" name="exam2" size="15"></td>
        <td><input type="text" name="board2" size="15"></td>
        <td><input type="text" name="percentage2" size="15"></td>
        <td><input type="text" name="year2" size="15"></td>
    </tr>

    <tr>
        <td></td>
        <td>03 <input type="text" name="exam3" size="15"></td>
        <td><input type="text" name="board3" size="15"></td>
        <td><input type="text" name="percentage3" size="15"></td>
        <td><input type="text" name="year3" size="15"></td>
    </tr>

    <tr>
        <td></td>
        <td>04 <input type="text" name="exam4" size="15"></td>
        <td><input type="text" name="board4" size="15"></td>
        <td><input type="text" name="percentage4" size="15"></td>
        <td><input type="text" name="year4" size="15"></td>
    </tr>
</table>
<br>
<table cellpadding="1" cellspacing="1">
    <tr>
        <td>COURSES<br>APPLIED<br>FOR</td>
        <td>
            <input type="checkbox" id="bca" name="courses" value="BCA">
            <label for="bca">BCA</label>

            <input type="checkbox" id="bcom" name="courses" value="B.Com">
            <label for="bcom">B.com</label>

            <input type="checkbox" id="bsc" name="courses" value="B.Sc">
            <label for="bsc">B.sc</label>

            <input type="checkbox" id="ba" name="courses" value="B.A">
            <label for="ba">B.A</label>
        </td>
    </tr>
</table>
<br>
<center>
    <input type="submit" value="submit">
    <input type="reset" value="reset">
</center>
</fieldset>
</form>
</body>
</html>
